{# Партиалы: сайдбар + топбар. Используются через {% include %}. #}

{% macro sidebar(active='') %}
<aside class="sidebar" aria-label="Главное меню">
    <nav class="sidebar-nav">
        <a href="/admin/prompts"
           class="sidebar-item sidebar-item--accent {% if active == 'admin' %}is-active{% endif %}"
           title="Админка">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </a>
    </nav>
</aside>
{% endmacro %}

{% macro topbar(back_url=None) %}
<header class="topbar">
    <a href="/" class="topbar-catalog" title="Каталог">
        <span class="topbar-catalog-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
        </span>
        <span>Каталог</span>
    </a>

    <div class="topbar-spacer"></div>
</header>

{% if back_url %}
<div class="back-row">
    <a href="{{ back_url }}" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>Назад</span>
    </a>
</div>
{% endif %}
{% endmacro %}
